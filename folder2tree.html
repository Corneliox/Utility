<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Tree Browser with Selection</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for a better look and feel */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* bg-gray-900 */
            color: #d1d5db; /* text-gray-300 */
        }
        .tree ul {
            padding-left: 1.5rem;
            border-left: 1px solid #4b5563; /* border-gray-600 */
        }
        .tree li {
            position: relative;
            list-style: none;
            padding: 0.25rem 0;
        }
        .tree-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem; /* rounded-md */
        }
        .tree-item.folder {
            cursor: pointer;
        }
        .tree-item.folder:hover {
             background-color: #374151; /* bg-gray-700 */
        }
        .tree-item .label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-grow: 1;
        }
        .tree .icon {
            width: 1.25rem; /* w-5 */
            height: 1.25rem; /* h-5 */
            flex-shrink: 0;
        }
        .tree .toggle-icon {
            transition: transform 0.2s ease-in-out;
        }
        .tree .collapsed > .tree-item > .label > .toggle-icon {
            transform: rotate(-90deg);
        }
        .tree .collapsed > ul {
            display: none;
        }
        /* Custom checkbox style */
        .tree-checkbox {
            width: 1rem;
            height: 1rem;
            accent-color: #3b82f6; /* blue-500 */
            cursor: pointer;
            /* Applying border-radius for a rounded look */
            border-radius: 0.25rem; /* rounded */
        }
        #copy-notification {
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="w-full max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
        <div class="bg-gray-800 shadow-2xl rounded-3xl">
            <div class="p-6 border-b border-gray-700">
                <h1 class="text-2xl font-bold text-white">File Tree Browser</h1>
                <p class="mt-2 text-gray-400">Select folders/files using checkboxes, then copy the structure as text.</p>
                
                <input type="file" id="folder-input" webkitdirectory directory multiple style="display: none;" />
                
                <div class="mt-4 flex flex-wrap items-center gap-4">
                    <button id="select-folder-btn" class="inline-flex items-center px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-gray-800 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" /></svg>
                        Browse Folder
                    </button>
                    <button id="copy-text-btn" class="hidden inline-flex items-center px-4 py-2 bg-green-600 text-white font-semibold rounded-lg shadow-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 focus:ring-offset-gray-800 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor"><path d="M8 2a1 1 0 000 2h2a1 1 0 100-2H8z" /><path d="M3 5a2 2 0 012-2h6a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H6zm3 0a1 1 0 000 2h3a1 1 0 100-2H9zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H6zm3 0a1 1 0 100 2h3a1 1 0 100-2H9z" /></svg>
                        Copy Selected as Text
                    </button>
                    
                    <div class="flex items-center gap-2 text-sm ml-2">
                        <input type="checkbox" id="folders-only-checkbox" class="tree-checkbox">
                        <label for="folders-only-checkbox" class="cursor-pointer text-gray-300 hover:text-white transition-colors">Folders Only</label>
                    </div>

                    <div id="select-all-container" class="hidden ml-auto flex items-center gap-2 text-sm">
                        <input type="checkbox" id="select-all-checkbox" class="tree-checkbox" checked>
                        <label for="select-all-checkbox" class="cursor-pointer text-gray-300 hover:text-white transition-colors">Select All</label>
                    </div>
                </div>
            </div>
            
            <div id="tree-container" class="p-6 h-96 overflow-y-auto tree">
                <p id="placeholder" class="text-gray-500">Your folder structure will appear here...</p>
            </div>
        </div>
        <footer class="text-center mt-4 text-gray-500 text-sm">
            <p>All files are processed locally in your browser. Nothing is uploaded.</p>
        </footer>
    </div>

    <div id="copy-notification" class="fixed bottom-5 right-5 bg-gray-900 text-white py-2 px-4 rounded-lg shadow-lg opacity-0 transform translate-y-3">
        Copied to clipboard!
    </div>

    <script>
        // --- DOM Elements ---
        const folderInput = document.getElementById('folder-input');
        const selectFolderBtn = document.getElementById('select-folder-btn');
        const copyTextBtn = document.getElementById('copy-text-btn');
        const treeContainer = document.getElementById('tree-container');
        const placeholder = document.getElementById('placeholder');
        const copyNotification = document.getElementById('copy-notification');
        const selectAllContainer = document.getElementById('select-all-container');
        const selectAllCheckbox = document.getElementById('select-all-checkbox');
        const foldersOnlyCheckbox = document.getElementById('folders-only-checkbox'); // DOM Baru

        // --- State ---
        let fileTreeData = null;
        let selectedFilesList = null; // Menyimpan data file agar bisa dirender ulang

        // --- SVG Icons ---
        const folderIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="icon text-yellow-400" viewBox="0 0 20 20" fill="currentColor"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" /></svg>`;
        const fileIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="icon text-gray-300" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd" /></svg>`;
        const toggleIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="icon toggle-icon text-gray-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>`;

        // --- Event Listeners ---
        selectFolderBtn.addEventListener('click', () => folderInput.click());
        folderInput.addEventListener('change', handleFolderSelection);
        copyTextBtn.addEventListener('click', handleCopyText);
        selectAllCheckbox.addEventListener('change', handleSelectAll);
        
        // Listener baru untuk render ulang saat opsi diganti
        foldersOnlyCheckbox.addEventListener('change', () => {
            if (selectedFilesList) {
                renderTree(selectedFilesList); 
            }
        });

        // --- Core Functions ---

        function handleFolderSelection(event) {
            selectedFilesList = event.target.files;
            if (selectedFilesList.length === 0) return;
            renderTree(selectedFilesList);
        }

        function renderTree(files) {
            placeholder.style.display = 'none';
            // Sekarang buildTree membaca opsi checkbox
            fileTreeData = buildTree(files, foldersOnlyCheckbox.checked); 
            const treeElement = createTreeElement(fileTreeData);
            treeContainer.innerHTML = '';
            treeContainer.appendChild(treeElement);
            addEventListeners();
            
            copyTextBtn.classList.remove('hidden');
            selectAllContainer.classList.remove('hidden');
            selectAllCheckbox.checked = true;
        }

        function buildTree(files, isFoldersOnly) {
            const filePaths = Array.from(files).map(file => file.webkitRelativePath);
            const rootName = filePaths[0].split('/')[0];
            const tree = { name: rootName, type: 'folder', children: {}, path: rootName };

            for (const path of filePaths) {
                const parts = path.split('/');
                let currentNode = tree.children;
                let currentPath = rootName;
                for (let i = 1; i < parts.length; i++) {
                    const part = parts[i];
                    currentPath += '/' + part;
                    const isLastPart = i === parts.length - 1;
                    const isFolder = i < parts.length - 1 || (isLastPart && path.endsWith('/'));

                    // Logika Pilihan: Abaikan file jika opsi Folders Only dicentang
                    if (isFoldersOnly && !isFolder) {
                        continue;
                    }

                    if (!currentNode[part]) {
                        currentNode[part] = {
                            name: part,
                            type: isFolder ? 'folder' : 'file',
                            children: isFolder ? {} : null,
                            path: currentPath
                        };
                    }
                    if (currentNode[part].type === 'folder') {
                        currentNode = currentNode[part].children;
                    }
                }
            }
            return tree;
        }

        function createTreeElement(node) {
            const li = document.createElement('li');
            li.dataset.path = node.path;

            const itemDiv = document.createElement('div');
            itemDiv.className = `tree-item ${node.type}`;
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'tree-checkbox rounded'; // Added 'rounded' class
            checkbox.checked = true;
            checkbox.dataset.path = node.path;
            
            const labelSpan = document.createElement('span');
            labelSpan.className = 'label';

            if (node.type === 'folder') {
                const hasChildren = node.children && Object.keys(node.children).length > 0;
                const toggle = hasChildren ? toggleIcon : `<span class="icon"></span>`;
                labelSpan.innerHTML = `${toggle}${folderIcon} ${node.name}`;
                li.classList.add('collapsed');

                const childrenContainer = document.createElement('ul');
                const childrenNodes = Object.values(node.children).sort((a, b) => {
                    if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
                    return a.name.localeCompare(b.name);
                });
                childrenNodes.forEach(child => childrenContainer.appendChild(createTreeElement(child)));
                itemDiv.appendChild(checkbox);
                itemDiv.appendChild(labelSpan);
                li.appendChild(itemDiv);
                li.appendChild(childrenContainer);
            } else {
                labelSpan.innerHTML = `${fileIcon} ${node.name}`;
                itemDiv.appendChild(checkbox);
                itemDiv.appendChild(labelSpan);
                li.appendChild(itemDiv);
            }
            return li;
        }

        function addEventListeners() {
            treeContainer.querySelectorAll('.tree-item.folder').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.type === 'checkbox') return;
                    item.parentElement.classList.toggle('collapsed');
                });
            });
            treeContainer.querySelectorAll('.tree-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', handleCheckboxChange);
            });
        }
        
        function handleCheckboxChange(event) {
            const checkbox = event.target;
            const li = checkbox.closest('li');
            const isChecked = checkbox.checked;

            li.querySelectorAll('.tree-checkbox').forEach(childCheckbox => {
                childCheckbox.checked = isChecked;
            });

            let current = li.parentElement.closest('li');
            while (current) {
                const parentCheckbox = current.querySelector(':scope > .tree-item > .tree-checkbox');
                if (isChecked) {
                    parentCheckbox.checked = true;
                } else {
                    const allSiblingsUnchecked = ![...current.querySelectorAll('.tree-checkbox')].slice(1).some(cb => cb.checked);
                    if (allSiblingsUnchecked) {
                        parentCheckbox.checked = false;
                    }
                }
                current = current.parentElement.closest('li');
            }
            updateSelectAllState();
        }
        
        function handleSelectAll() {
            const isChecked = selectAllCheckbox.checked;
            treeContainer.querySelectorAll('.tree-checkbox').forEach(cb => cb.checked = isChecked);
        }

        function updateSelectAllState() {
            const allCheckboxes = treeContainer.querySelectorAll('.tree-checkbox');
            if (allCheckboxes.length === 0) return;
            const allChecked = [...allCheckboxes].every(cb => cb.checked);
            selectAllCheckbox.checked = allChecked;
        }

        function handleCopyText() {
            if (!fileTreeData) return;
            const selectedPaths = [...treeContainer.querySelectorAll('.tree-checkbox:checked')].map(cb => cb.dataset.path);
            if (selectedPaths.length === 0) {
                showCopyNotification("Nothing selected to copy!", true);
                return;
            }
            const textTree = generateTextTree(fileTreeData, selectedPaths);
            copyToClipboard(textTree);
        }

        function generateTextTree(node, selectedPaths) {
            if (!selectedPaths.includes(node.path)) return "";
            let result = `${node.name}/\n`;
            
            const children = Object.values(node.children)
                .filter(child => selectedPaths.includes(child.path))
                .sort((a, b) => {
                    if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
                    return a.name.localeCompare(b.name);
                });
            
            children.forEach((child, index) => {
                const isLast = index === children.length - 1;
                result += textTreeRecursive(child, "", isLast, selectedPaths);
            });
            return result;
        }

        function textTreeRecursive(node, prefix, isLast, selectedPaths) {
            if (!selectedPaths.includes(node.path)) return "";
            
            const connector = isLast ? "└── " : "├── ";
            let result = `${prefix}${connector}${node.name}${node.type === 'folder' ? '/' : ''}\n`;

            if (node.type === 'folder' && node.children) {
                const newPrefix = prefix + (isLast ? "    " : "│   ");
                const children = Object.values(node.children)
                    .filter(child => selectedPaths.includes(child.path))
                    .sort((a, b) => {
                        if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
                        return a.name.localeCompare(b.name);
                    });
                
                children.forEach((child, index) => {
                    const isChildLast = index === children.length - 1;
                    result += textTreeRecursive(child, newPrefix, isChildLast, selectedPaths);
                });
            }
            return result;
        }

        function copyToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showCopyNotification("Copied to clipboard!");
            } catch (err) {
                console.error('Failed to copy text: ', err);
                showCopyNotification("Failed to copy!", true);
            }
            document.body.removeChild(textArea);
        }

        function showCopyNotification(message, isError = false) {
            copyNotification.textContent = message;
            copyNotification.style.backgroundColor = isError ? '#991b1b' : '#1f2937'; // red-800 or gray-800
            copyNotification.classList.remove('opacity-0', 'translate-y-3');
            copyNotification.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                copyNotification.classList.remove('opacity-100', 'translate-y-0');
                copyNotification.classList.add('opacity-0', 'translate-y-3');
            }, 2000);
        }

    </script>

</body>
</html>
