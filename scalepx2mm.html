<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skala X & Y - Kontrol Ukuran Font (200 px = 1 mm)</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
    .toolbar { 
      display: flex; 
      gap: 12px; 
      align-items: center; 
      background: #fff; 
      padding: 12px 20px; 
      border-radius: 8px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 15px; 
      flex-wrap: wrap; 
    }
    .canvas-container { 
      position: relative; 
      overflow: auto; 
      background: #222; 
      border-radius: 8px; 
      max-height: 80vh; 
      border: 1px solid #ccc;
    }
    canvas { display: block; cursor: crosshair; }
    button, input, select { 
      padding: 6px 12px; 
      font-size: 14px; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
    }
    button { background-color: #007bff; color: white; cursor: pointer; border: none; }
    button:hover { background-color: #0056b3; }
    button.active { background-color: #28a745; font-weight: bold; }
    button.secondary { background-color: #6c757d; }
    button.secondary:hover { background-color: #5a6268; }
    button.danger { background-color: #dc3545; }
    button.danger:hover { background-color: #bd2130; }
    .info-panel { 
      margin-top: 15px; 
      padding: 12px; 
      background: #e9ecef; 
      border-radius: 6px; 
      font-weight: bold; 
      font-size: 16px; 
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <input type="file" id="imageLoader" accept="image/*">
    
    <button id="modeDrawBtn" class="active">Mode: Tambah Skala</button>
    <button id="modeEditBtn" class="secondary">Mode: Edit / Pilih Garis</button>

    <label>Format: 
      <select id="unitFormat">
        <option value="both">px/mm (10.000mm/2000px)</option>
        <option value="mm">mm saja (10.000mm)</option>
        <option value="px">px saja (2000px)</option>
      </select>
    </label>
    
    <label>Ukuran Font: <input type="number" id="fontSize" value="12" min="8" max="36" style="width: 55px;"> px</label>
    <label>Warna: <input type="color" id="lineColor" value="#000000"></label>
    <label>Ketebalan Garis: <input type="number" id="lineWidth" value="2" min="1" max="10" style="width: 50px;"></label>
    
    <button class="danger" id="deleteSelectedBtn" style="display: none;">Hapus Terpilih</button>
    <button class="secondary" id="undoBtn">Undo</button>
    <button class="danger" id="clearBtn">Reset Semua</button>
    <button id="saveBtn">Simpan Gambar</button>
  </div>

  <div class="canvas-container">
    <canvas id="imageCanvas"></canvas>
  </div>

  <div class="info-panel" id="measureInfo">
    Status: Silakan muat gambar atau Paste (Ctrl+V).
  </div>

  <script>
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    const imageLoader = document.getElementById('imageLoader');
    const unitFormat = document.getElementById('unitFormat');
    const fontSize = document.getElementById('fontSize');
    const lineColor = document.getElementById('lineColor');
    const lineWidth = document.getElementById('lineWidth');
    const modeDrawBtn = document.getElementById('modeDrawBtn');
    const modeEditBtn = document.getElementById('modeEditBtn');
    const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
    const undoBtn = document.getElementById('undoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const saveBtn = document.getElementById('saveBtn');
    const measureInfo = document.getElementById('measureInfo');

    let img = new Image();
    let scales = []; 
    let history = []; 
    
    let currentMode = 'draw'; 
    let startPoint = null;
    let isSelecting = false;
    let mousePos = { x: -100, y: -100 };
    
    let selectedScaleIndex = -1;
    let draggingHandle = null; 

    const SCALE_PX_PER_MM = 200;

    imageLoader.addEventListener('change', (e) => {
      if (e.target.files[0]) loadImage(e.target.files[0]);
    });

    window.addEventListener('paste', (e) => {
      const items = e.clipboardData.items;
      for (let item of items) {
        if (item.type.indexOf('image') !== -1) {
          loadImage(item.getAsFile());
        }
      }
    });

    function loadImage(file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        img = new Image();
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          scales = [];
          selectedScaleIndex = -1;
          startPoint = null;
          isSelecting = false;
          saveHistory();
          render();
          measureInfo.textContent = 'Gambar dimuat. Klik pada Ujung Kiri-Atas area yang ingin diukur.';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function saveHistory() {
      history.push(JSON.parse(JSON.stringify(scales)));
    }

    modeDrawBtn.addEventListener('click', () => {
      currentMode = 'draw';
      selectedScaleIndex = -1;
      modeDrawBtn.className = 'active';
      modeEditBtn.className = 'secondary';
      deleteSelectedBtn.style.display = 'none';
      measureInfo.textContent = 'Mode Tambah Skala: Klik titik 1 (Kiri-Atas) lalu titik 2 (Kanan-Bawah).';
      render();
    });

    modeEditBtn.addEventListener('click', () => {
      currentMode = 'edit';
      isSelecting = false;
      startPoint = null;
      modeDrawBtn.className = 'secondary';
      modeEditBtn.className = 'active';
      deleteSelectedBtn.style.display = 'inline-block';
      measureInfo.textContent = 'Mode Edit: Klik skala untuk memilih. Geser titik ujung atau ubah ukuran font.';
      render();
    });

    function formatValue(distPx, fmt) {
      const distMm = distPx / SCALE_PX_PER_MM;
      if (fmt === 'mm') return `${distMm.toFixed(3)}mm`;
      if (fmt === 'px') return `${Math.round(distPx)}px`;
      return `${distMm.toFixed(3)}mm/${Math.round(distPx)}px`;
    }

    // Fungsi Render Teks dengan Background Dinamis Sesuai Ukuran Font
    function drawTextWithBg(context, text, x, y, color, align = 'center', fontSizePx = 12) {
      context.save();
      const size = parseInt(fontSizePx) || 12;
      context.font = `bold ${size}px Arial`;
      context.textAlign = align;
      const metrics = context.measureText(text);
      const width = metrics.width;
      const height = size;
      
      let bgX = x - width / 2 - 3;
      if (align === 'right') bgX = x - width - 3;
      if (align === 'left') bgX = x - 3;

      context.fillStyle = 'rgba(255, 255, 255, 0.85)';
      context.fillRect(bgX, y - height + 2, width + 6, height + 4);

      context.fillStyle = color;
      context.fillText(text, x, y);
      context.restore();
    }

    function drawXYScale(context, scaleObj, isSelected = false) {
      const { p1, p2, color, thickness, format, fontSz } = scaleObj;
      const left = Math.min(p1.x, p2.x);
      const right = Math.max(p1.x, p2.x);
      const top = Math.min(p1.y, p2.y);
      const bottom = Math.max(p1.y, p2.y);

      const widthPx = right - left;
      const heightPx = bottom - top;
      const tickSize = Math.max(8, thickness * 3);
      const subTickSize = tickSize * 0.6;

      const mainFontSize = fontSz || 12;
      const subFontSize = Math.max(8, Math.round(mainFontSize * 0.85));

      context.save();
      context.strokeStyle = color;
      context.lineWidth = thickness;

      // 1. Garis Bounding Box Putus-putus
      context.setLineDash([5, 5]);
      context.beginPath();
      context.moveTo(left, top);
      context.lineTo(right, top);
      context.lineTo(right, bottom);
      context.stroke();
      context.setLineDash([]);

      // 2. Sumbu X Utama
      context.beginPath();
      context.moveTo(left, bottom);
      context.lineTo(right, bottom);
      context.moveTo(left, bottom - tickSize);
      context.lineTo(left, bottom + tickSize);
      context.moveTo(right, bottom - tickSize);
      context.lineTo(right, bottom + tickSize);
      context.stroke();

      // 3. Sumbu Y Utama
      context.beginPath();
      context.moveTo(left, bottom);
      context.lineTo(left, top);
      context.moveTo(left - tickSize, bottom);
      context.lineTo(left + tickSize, bottom);
      context.moveTo(left - tickSize, top);
      context.lineTo(left + tickSize, top);
      context.stroke();

      // 4. Sub-ticks & Angka Sumbu X
      const totalXmm = Math.floor(widthPx / SCALE_PX_PER_MM);
      context.beginPath();
      for (let i = 1; i <= totalXmm; i++) {
        const tickX = left + (i * SCALE_PX_PER_MM);
        if (tickX < right - 15) {
          context.moveTo(tickX, bottom - subTickSize);
          context.lineTo(tickX, bottom + subTickSize);
          drawTextWithBg(context, `${i}`, tickX, bottom + subFontSize + 4, color, 'center', subFontSize);
        }
      }
      context.stroke();

      // 5. Sub-ticks & Angka Sumbu Y
      const totalYmm = Math.floor(heightPx / SCALE_PX_PER_MM);
      context.beginPath();
      for (let j = 1; j <= totalYmm; j++) {
        const tickY = bottom - (j * SCALE_PX_PER_MM);
        if (tickY > top + 15) {
          context.moveTo(left - subTickSize, tickY);
          context.lineTo(left + subTickSize, tickY);
          drawTextWithBg(context, `${j}`, left - 12, tickY + (subFontSize / 3), color, 'right', subFontSize);
        }
      }
      context.stroke();

      // Labeling Utama
      drawTextWithBg(context, '(0,0)', left - 10, bottom + mainFontSize + 8, color, 'right', mainFontSize);
      drawTextWithBg(context, `X: ${formatValue(widthPx, format)}`, (left + right) / 2, bottom + (mainFontSize * 2) + 8, color, 'center', mainFontSize);
      drawTextWithBg(context, `Y: ${formatValue(heightPx, format)}`, left - 12, (top + bottom) / 2 + (mainFontSize / 3), color, 'right', mainFontSize);

      if (isSelected) {
        context.fillStyle = '#ff0000';
        context.fillRect(left - 6, top - 6, 12, 12); 
        context.fillRect(right - 6, bottom - 6, 12, 12); 
        
        context.strokeStyle = '#ff0000';
        context.lineWidth = 1.5;
        context.setLineDash([3, 3]);
        context.strokeRect(left - 4, top - 4, widthPx + 8, heightPx + 8);
      }

      context.restore();
    }

    function drawCrosshair(context, pos) {
      if (pos.x < 0 || pos.y < 0) return;
      context.save();
      context.strokeStyle = 'rgba(255, 0, 0, 0.75)'; 
      context.lineWidth = 1;
      context.setLineDash([4, 4]);

      context.beginPath();
      context.moveTo(pos.x, 0);
      context.lineTo(pos.x, canvas.height);
      context.stroke();

      context.beginPath();
      context.moveTo(0, pos.y);
      context.lineTo(canvas.width, pos.y);
      context.stroke();

      context.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (img.src) {
        ctx.drawImage(img, 0, 0);
      }

      scales.forEach((scale, idx) => {
        drawXYScale(ctx, scale, idx === selectedScaleIndex);
      });

      if (isSelecting && startPoint) {
        const previewObj = {
          p1: startPoint,
          p2: mousePos,
          color: lineColor.value,
          thickness: parseInt(lineWidth.value),
          format: unitFormat.value,
          fontSz: parseInt(fontSize.value) || 12
        };
        drawXYScale(ctx, previewObj, false);
      }

      drawCrosshair(ctx, mousePos);
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mousePos = { x: e.clientX - rect.left, y: e.clientY - rect.top };

      if (currentMode === 'draw' && isSelecting) {
        const wPx = Math.abs(mousePos.x - startPoint.x);
        const hPx = Math.abs(mousePos.y - startPoint.y);
        measureInfo.textContent = `Preview: X = ${(wPx/SCALE_PX_PER_MM).toFixed(3)}mm | Y = ${(hPx/SCALE_PX_PER_MM).toFixed(3)}mm`;
      } else if (currentMode === 'edit' && draggingHandle && selectedScaleIndex >= 0) {
        const scale = scales[selectedScaleIndex];
        if (draggingHandle === 'p1') {
          scale.p1 = { ...mousePos };
        } else if (draggingHandle === 'p2') {
          scale.p2 = { ...mousePos };
        }
      }

      render();
    });

    canvas.addEventListener('mouseleave', () => {
      mousePos = { x: -100, y: -100 };
      render();
    });

    canvas.addEventListener('mousedown', (e) => {
      if (!img.src) return;
      const rect = canvas.getBoundingClientRect();
      const clickPoint = { x: e.clientX - rect.left, y: e.clientY - rect.top };

      if (currentMode === 'draw') {
        if (!isSelecting) {
          startPoint = clickPoint;
          isSelecting = true;
          measureInfo.textContent = 'Titik 1 Terkunci. Geser mouse & klik titik ke-2 (Kanan-Bawah).';
        } else {
          scales.push({
            p1: startPoint,
            p2: clickPoint,
            color: lineColor.value,
            thickness: parseInt(lineWidth.value),
            format: unitFormat.value,
            fontSz: parseInt(fontSize.value) || 12
          });
          saveHistory();
          isSelecting = false;
          startPoint = null;
          measureInfo.textContent = 'Skala berhasil ditambahkan!';
        }
      } else if (currentMode === 'edit') {
        if (selectedScaleIndex >= 0) {
          const s = scales[selectedScaleIndex];
          const left = Math.min(s.p1.x, s.p2.x);
          const right = Math.max(s.p1.x, s.p2.x);
          const top = Math.min(s.p1.y, s.p2.y);
          const bottom = Math.max(s.p1.y, s.p2.y);

          if (Math.hypot(clickPoint.x - left, clickPoint.y - top) < 12) {
            draggingHandle = 'p1';
            return;
          }
          if (Math.hypot(clickPoint.x - right, clickPoint.y - bottom) < 12) {
            draggingHandle = 'p2';
            return;
          }
        }

        let found = -1;
        for (let i = scales.length - 1; i >= 0; i--) {
          const s = scales[i];
          const left = Math.min(s.p1.x, s.p2.x);
          const right = Math.max(s.p1.x, s.p2.x);
          const top = Math.min(s.p1.y, s.p2.y);
          const bottom = Math.max(s.p1.y, s.p2.y);

          if (clickPoint.x >= left - 10 && clickPoint.x <= right + 10 &&
              clickPoint.y >= top - 10 && clickPoint.y <= bottom + 10) {
            found = i;
            break;
          }
        }

        selectedScaleIndex = found;
        if (found >= 0) {
          lineColor.value = scales[found].color;
          lineWidth.value = scales[found].thickness;
          unitFormat.value = scales[found].format;
          fontSize.value = scales[found].fontSz || 12;
          measureInfo.textContent = `Skala #${found + 1} dipilih. Ubah ukuran font, warna, atau posisi titiknya.`;
        } else {
          measureInfo.textContent = 'Tidak ada skala yang dipilih.';
        }
      }
      render();
    });

    canvas.addEventListener('mouseup', () => {
      if (draggingHandle) {
        draggingHandle = null;
        saveHistory();
      }
    });

    // Event Listener Real-Time untuk Ukuran Font
    fontSize.addEventListener('input', () => {
      if (currentMode === 'edit' && selectedScaleIndex >= 0) {
        scales[selectedScaleIndex].fontSz = parseInt(fontSize.value) || 12;
        render();
      }
    });

    lineColor.addEventListener('input', () => {
      if (currentMode === 'edit' && selectedScaleIndex >= 0) {
        scales[selectedScaleIndex].color = lineColor.value;
        render();
      }
    });

    lineWidth.addEventListener('input', () => {
      if (currentMode === 'edit' && selectedScaleIndex >= 0) {
        scales[selectedScaleIndex].thickness = parseInt(lineWidth.value);
        render();
      }
    });

    unitFormat.addEventListener('change', () => {
      if (currentMode === 'edit' && selectedScaleIndex >= 0) {
        scales[selectedScaleIndex].format = unitFormat.value;
        render();
      }
    });

    deleteSelectedBtn.addEventListener('click', () => {
      if (selectedScaleIndex >= 0) {
        scales.splice(selectedScaleIndex, 1);
        selectedScaleIndex = -1;
        saveHistory();
        render();
        measureInfo.textContent = 'Skala terpilih telah dihapus.';
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        isSelecting = false;
        startPoint = null;
        selectedScaleIndex = -1;
        render();
        measureInfo.textContent = 'Aksi dibatalkan.';
      }
    });

    undoBtn.addEventListener('click', () => {
      if (history.length > 1) {
        history.pop();
        scales = JSON.parse(JSON.stringify(history[history.length - 1]));
        selectedScaleIndex = -1;
        render();
        measureInfo.textContent = 'Aksi terakhir dibatalkan (Undo).';
      }
    });

    clearBtn.addEventListener('click', () => {
      if (img.src) {
        scales = [];
        selectedScaleIndex = -1;
        saveHistory();
        render();
        measureInfo.textContent = 'Semua skala di-reset.';
      }
    });

    saveBtn.addEventListener('click', () => {
      if (!img.src) return;
      const tempPos = { ...mousePos };
      mousePos = { x: -100, y: -100 };
      selectedScaleIndex = -1;
      render();

      const link = document.createElement('a');
      link.download = 'oct-skala-font-adjusted.png';
      link.href = canvas.toDataURL();
      link.click();

      mousePos = tempPos;
      render();
    });
  </script>
</body>
</html>
